name: Sync WinGet Fork

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-winget-fork:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Synchronize WinGet fork with upstream
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          pwsh -NoProfile -NonInteractive -File .\Submit-VeyonWingetUpdate.ps1 -SyncForkOnly
